# Coolify can deploy this file as a Docker Compose service.
# Do not publish a host port here. Set the public URL in Coolify.
# The process listens on 0.0.0.0:7878 inside the container network.

services:
  relaybook-dashboard:
    build: .
    image: relaybook-dashboard:latest
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0:7878
      LEDGER_DIR: /data/ledger
      CONTEXT_DIR: /data/context
      ARTIFACTS_DIR: /data/context/artifacts
      POLL_MS: ${POLL_MS:-1500}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_BASIC_USER: ${DASHBOARD_BASIC_USER:-}
      DASHBOARD_BASIC_PASSWORD: ${DASHBOARD_BASIC_PASSWORD:-}
    volumes:
      - ${LEDGER_DIR}:/data/ledger:ro
      - ${CONTEXT_DIR}:/data/context:ro
    expose:
      - "7878"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7878/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Optional. Use a uid that can read the mounted files.
    # user: "1000:1000"
    # Coolify assigns the domain. Example label, unused unless you enable it there:
    # labels:
    #   - "coolify.service=relaybook-dashboard"
