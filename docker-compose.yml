# Coolify can deploy this file with the Docker Compose build pack.
# The port is published only on the host's Tailscale IPv4 (TS_BIND_IP, from
# `tailscale ip -4`), so the dashboard is reachable over the tailnet and not
# on the LAN or the internet. Do not attach a Coolify domain.
# The process listens on 0.0.0.0:7878 inside the container.

services:
  relaybook-dashboard:
    build: .
    image: relaybook-dashboard:latest
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0:7878
      LEDGER_DIR: /data/ledger
      CONTEXT_DIR: /data/context
      ARTIFACTS_DIR: /data/context/artifacts
      POLL_MS: ${POLL_MS:-1500}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_BASIC_USER: ${DASHBOARD_BASIC_USER:-}
      DASHBOARD_BASIC_PASSWORD: ${DASHBOARD_BASIC_PASSWORD:-}
    volumes:
      - ${LEDGER_DIR}:/data/ledger:ro
      - ${CONTEXT_DIR}:/data/context:ro
    ports:
      - "${TS_BIND_IP:?set TS_BIND_IP to the host's Tailscale IPv4}:${HOST_PORT:-7878}:7878"
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7878/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Optional. Use a uid that can read the mounted files.
    # user: "1000:1000"
