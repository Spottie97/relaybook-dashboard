[package]
name = "relaybook-dashboard"
version = "0.1.0"
edition = "2021"
description = "Watch-only command center for a Relaybook multi-agent ledger"
license = "MIT"
publish = false
readme = "README.md"

[[bin]]
name = "relaybook-dashboard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7.9", features = ["macros"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
http = "1"
mime_guess = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
